# Production, on the homelab box. Run from the repository root:
#
#   docker compose -f docker-compose.prod.yml <command>
#
# or through the platform's `~/cg1618/bin/deploy media`, which takes a dump
# before it pulls. How this is operated, what is in .env, and how to roll back
# are in deploy/README.md.
#
# This file holds ONE service. PostgreSQL and the Cloudflare Tunnel are shared
# by every application on the box and belong to cg1618-apps/platform, whose
# compose project runs them on the `cg1618` network this one joins.
#
# This file lives at the repository root ON PURPOSE. Compose takes its project
# directory from the compose file's own location and loads `.env` from there,
# so the same file under deploy/ would look for deploy/.env and silently
# interpolate every ${...} to an empty string. `env_file:` is a separate
# mechanism and would keep working, which is what makes the failure quiet.
#
# It does not collide with docker-compose.yml - that is the development file,
# running a bare PostgreSQL and nothing else. Compose only picks up
# `docker-compose.yml`/`compose.yaml` by default, never this name, so
# production is always explicit: `-f docker-compose.prod.yml`.

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    # Named even though it is built here, so moving to a registry later is a
    # change to what this name points at rather than a restructure.
    #
    # No container_name. Compose derives container names from
    # COMPOSE_PROJECT_NAME (media-app-1), which makes the project name the
    # single place a name is written. A hardcoded container_name is a second
    # place for a stale one to hide.
    image: media-app:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # entrypoint.sh binds ${PORT:-8080}; the ingress routes to
      # media-app:8000.
      PORT: 8000
    volumes:
      # Bind mounts, not named volumes, so rsync and the backup see ordinary
      # files. static/library/ is the only copy of every uploaded image there
      # is - it cannot be re-fetched the way covers can.
      - ./static/covers:/app/static/covers
      - ./static/library:/app/static/library
    networks:
      cg1618:
        # The tunnel routes media.cg1618.com to http://media-app:8000, and that
        # name is GENERATED from apps.yml in cg1618-apps/platform. Changing this
        # alias without changing the registry produces a 502 on the hostname,
        # with both files looking correct on their own.
        aliases:
          - media-app
    healthcheck:
      # /api/health, never "/". The catch-all route serves the SPA for any path,
      # so a probe against "/" returns 200 with the database down - which is why
      # this service carried no healthcheck at all until that endpoint existed.
      #
      # python rather than curl: the runtime image is python:3.13-slim and does
      # not ship curl. urlopen raises on a 503, which is the non-zero exit.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous on purpose: entrypoint.sh runs `alembic upgrade head` before
      # uvicorn binds, and a migration on a cold box takes longer than any
      # sensible probe interval. A short start_period would mark a correctly
      # migrating container unhealthy and restart it mid-migration.
      start_period: 120s
    # No depends_on. PostgreSQL belongs to the platform's compose project and
    # compose cannot order services across projects, so the guarantee that used
    # to come from `condition: service_healthy` now comes from `restart:
    # unless-stopped`: on a cold boot the container exits when alembic cannot
    # reach the database, and docker restarts it until it can. Bringing the
    # platform stack up first avoids it entirely; after a power cut it costs a
    # few restarts in the log.

networks:
  cg1618:
    # Created by the platform's compose project. `external` means this file
    # joins it and never defines it - two definitions of one network is how a
    # second, empty network ends up carrying half the containers.
    external: true
