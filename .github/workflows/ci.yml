name: Tests

# Pull requests and the merge queue. There is deliberately no `push` trigger.
#
# A pull request is tested against the base as it was when the check ran, so
# on its own a green tick says only that the change works by itself. What
# makes the tree that lands a tested tree differs by branch:
#
# - `dev` merges through a merge queue. A queued pull request is tested again
#   as a `merge_group` run, on `dev` plus every pull request queued ahead of
#   it, and lands only if that passes - so the combination that reaches `dev`
#   is exactly the one tested, without bringing branches up to date by hand.
# - `main` takes one release pull request at a time, and moves only when one
#   merges. A pull request's run tests its head merged onto the base, so
#   with nothing else able to move `main` while it runs, that run tested the
#   tree that deploys. The ruleset therefore does not also require the
#   branch to be up to date: every release merge leaves a merge commit on
#   `main` that `dev` never receives, and the strict rule would count those
#   and block the next release for no change in content.
#
# A re-run on push would test a tree one of those two had just tested. Putting
# a push trigger back is only needed if either guarantee is removed.
on:
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: media_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_test
      # The runner has no .env, so without these the app's startup check
      # refuses to boot and every API test fails. They are throwaway values
      # for a throwaway database - the check tests real secrets by building
      # its own Settings, not by reading these.
      APP_ENV: development
      JWT_SECRET_KEY: ci-not-a-real-secret
      ADMIN_PASSWORD: ci-not-a-real-password
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the base of the pull request is present for
          # the diff below. A shallow clone holds only the merge commit.
          fetch-depth: 0

      # A pull request that changes only documentation skips everything below
      # and still reports `test` as passed. Not a workflow-level paths-ignore:
      # that leaves the required check unreported, and an unreported required
      # check blocks the merge for ever. Documentation is `docs/**` and any
      # `*.md`; one other file anywhere runs the whole job. An empty diff runs
      # it too, so the fast path is only taken on positive evidence.
      - name: Decide whether anything but documentation changed
        id: changes
        env:
          # A merge-queue run has no pull_request payload; its base and head
          # are the merge group's. Without the fallback the diff would be
          # empty, which runs the whole job - safe, but never the fast path.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$'; then
            echo "Documentation only: every other step is skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.code == 'true'
        with:
          # Same interpreter as the runtime image (dockerfile: python:3.13-slim).
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        if: steps.changes.outputs.code == 'true'
        run: pip install -r requirements-dev.txt

      # Two migrations parented on the same revision merge cleanly in git and
      # only collide in Alembic's revision graph. In a merge-queue run that is
      # the combination being tested, and this says so in seconds rather than
      # at the end of the suite (where test_migrations_build_the_schema.py
      # would also fail). Needs no database: `heads` reads the revision files.
      - name: One Alembic head
        if: steps.changes.outputs.code == 'true'
        run: |
          heads=$(alembic heads)
          echo "$heads"
          if [ "$(echo "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::More than one Alembic head. Reparent the newer revision's down_revision onto the other head (CLAUDE.md, \"Migrations and branches\")."
            exit 1
          fi

      - name: Lint backend
        if: steps.changes.outputs.code == 'true'
        run: ruff check .

      - name: Lint shell scripts
        if: steps.changes.outputs.code == 'true'
        # deploy/migrations is named without an extension because the platform
        # calls it by that exact path, so a *.sh glob does not reach it and it
        # has to be named. shellcheck reads its shebang.
        run: shellcheck deploy/migrations deploy/backup/*.sh

      - name: Backend tests
        if: steps.changes.outputs.code == 'true'
        run: pytest -q -p no:cacheprovider

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        if: steps.changes.outputs.code == 'true'
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        if: steps.changes.outputs.code == 'true'
        run: npm run test:run
        working-directory: frontend

      - name: Frontend build
        if: steps.changes.outputs.code == 'true'
        run: npm run build
        working-directory: frontend
